<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#42124e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>تقويمي – مهام</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bar:#42124e; --bar2:#5a1a6b; --bg:#303030; --panel:#383838; --cell:#424242; --text:#ececec; --muted:#a9a9a9;
  --purple:#c07ad8; --orange:#f49426; --today:#8aab1c; --accent:#8e3aa5; --danger:#c0392b; --line:#555;
  --c-empty:#424242; --c-reg:#1d4f8f; --c-done:#1f7a3d;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic","Droid Arabic Naskh","Droid Sans Arabic",system-ui,sans-serif;direction:rtl;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:960px;margin:0 auto;position:relative}

/* ---- top bar ---- */
.topbar{background:var(--bar);padding:calc(var(--safe-t) + 4px) 6px 4px 4px;display:flex;align-items:center;gap:2px;min-height:56px;flex:none}
.topbar h1{margin:0 8px;font-size:21px;font-weight:600;flex:1;letter-spacing:.2px}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:#fff;position:relative}
.ib:active{background:rgba(255,255,255,.14)}
.ib svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .tn{position:absolute;left:0;right:0;top:19px;text-align:center;font-size:11px;font-weight:700;line-height:14px}

/* ---- month header ---- */
.mhead{display:flex;align-items:center;padding:8px 6px 2px;flex:none}
.mhead .nav{width:48px;height:48px;border:0;background:transparent;font-size:30px;line-height:1;color:#fff;border-radius:50%}
.mhead .nav:active{background:rgba(255,255,255,.12)}
.mtitle{flex:1;text-align:center;background:none;border:0;padding:2px 4px}
.mtitle b{display:block;font-size:22px;font-weight:700;color:#f0f0f0}
.mtitle span{display:block;font-size:15px;color:var(--orange);margin-top:2px}
.yearnav{display:flex;justify-content:space-between;align-items:center;padding:0 10px 4px;flex:none;font-size:13px}
.yearnav button{border:1px solid #5d5d5d;background:#3a3a3a;border-radius:16px;padding:4px 12px;color:#ddd;font-size:13px}
.yearnav button:active{background:#4a4a4a}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 4px;flex:none;text-align:center;color:#c9c9c9;font-size:13px}
.wd div.fri{color:#e0b3ee}

/* ---- grid ---- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(60px,1fr);gap:4px;padding:4px;overflow-y:auto;touch-action:pan-y}
.cell{background:var(--c-empty);border-radius:7px;padding:3px 6px 3px;display:flex;flex-direction:column;align-items:stretch;min-width:0;position:relative;cursor:pointer;border:3px solid transparent;overflow:hidden;text-align:start}
.cell.blank{background:transparent;cursor:default;pointer-events:none}
.cell .p{font-size:19px;font-weight:700;line-height:1.15;color:#f2f2f2}
.cell .s{font-size:13px;line-height:1.1;font-weight:500}
.cell .s.m1{color:var(--purple)} .cell .s.m2{color:var(--orange)}
.cell.reg{background:var(--c-reg)} .cell.done{background:var(--c-done)}
.cell.today{border-color:var(--today)}
.cell.sel{outline:2px solid #fff;outline-offset:-2px}
.cell:active{filter:brightness(1.25)}
.cell .ev{margin-top:0;font-size:10px;line-height:1.3;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ev:first-of-type{margin-top:auto}
.cell .ev i{font-style:normal;opacity:.8;display:inline-block}
.cell .od{position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.cell.reg .s.m1,.cell.done .s.m1{color:#e6b8f5}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px 8px calc(var(--safe-b) + 8px);font-size:12px;color:#c4c4c4;flex:none}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.25)}

/* ---- menu ---- */
.menu{position:absolute;top:calc(var(--safe-t) + 50px);left:8px;background:#3d3d3d;border-radius:10px;min-width:210px;box-shadow:0 8px 28px rgba(0,0,0,.55);z-index:30;padding:6px 0;overflow:hidden}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:none;border:0;padding:13px 16px;font-size:15px}
.menu button:active{background:#505050}
.menu hr{border:0;border-top:1px solid #555;margin:4px 0}

/* ---- modal ---- */
.back{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--safe-b) + 16px);box-shadow:0 -6px 30px rgba(0,0,0,.5);animation:up .18s ease-out}
.sheet.full{max-width:760px;height:94dvh}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.back{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--orange);font-size:14px;margin-bottom:12px}
.shead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.shead>div{flex:1}
.x{border:0;background:#4a4a4a;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}

/* ---- forms ---- */
label.f{display:block;margin:12px 0 5px;font-size:14px;color:#d6d6d6}
.in,.sheet input[type=text],.sheet input[type=password],.sheet input[type=date],.sheet input[type=tel],.sheet input[type=number],.sheet select,.sheet textarea,.auth input{width:100%;background:#2a2a2a;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-size:16px;outline:none}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus,.auth input:focus{border-color:var(--purple);box-shadow:0 0 0 2px rgba(192,122,216,.25)}
.sheet textarea{min-height:84px;resize:vertical}
input.ltr{direction:ltr;text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{border:1px solid #666;background:#303030;border-radius:15px;padding:4px 11px;font-size:13px;color:#ddd}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:13px;color:var(--orange);margin-top:5px}
.err{background:#5a1f1f;color:#ffd6d2;border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;border:0;border-radius:10px;padding:13px 14px;font-size:16px;font-weight:600;background:var(--accent);color:#fff}
.btn.sec{background:#505050}.btn.danger{background:var(--danger)}.btn.ghost{background:transparent;border:1px solid #666}
.btn:active{filter:brightness(1.2)}
.btn.sm{padding:8px 12px;font-size:14px;min-width:0;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;background:#2f2f2f;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.sw input{display:none}
.sw .tg{width:50px;height:28px;border-radius:14px;background:#666;position:relative;transition:background .15s;flex:none}
.sw .tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+.tg{background:#2f9e55}.sw input:checked+.tg::after{transform:translateX(-22px)}
.seg{display:flex;background:#2a2a2a;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;border-radius:8px;padding:9px;background:transparent;color:#ccc;font-size:15px}
.seg button.on{background:var(--accent);color:#fff}
.step{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}
.step button{width:46px;height:46px;border-radius:50%;border:0;background:#505050;font-size:26px;color:#fff}
.step.num{direction:ltr}
.step b{min-width:70px;text-align:center;font-size:24px;direction:ltr}
.sec-t{font-size:13px;color:var(--purple);margin:20px 0 4px;font-weight:700;border-bottom:1px solid #4a4a4a;padding-bottom:5px}
.colors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.colors label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#ccc}
.colors input[type=color]{width:54px;height:36px;border:1px solid #777;border-radius:8px;background:none;padding:2px}

/* ---- entries ---- */
.ent{background:#2f2f2f;border-radius:11px;padding:11px 12px;margin:9px 0;border-inline-start:5px solid var(--c-reg)}
.ent.done{border-inline-start-color:#37b866}
.ent .t{display:flex;gap:8px;align-items:center}
.ent .t b{font-size:16px;flex:1}
.ent .meta{font-size:14px;color:#cfcfcf;margin-top:4px;line-height:1.7}
.ent .meta a{color:#e0b3ee;text-decoration:none}
.ent .money{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.ent .money span b{color:#fff}
.ent .note{font-size:13px;color:#b8b8b8;margin-top:5px;white-space:pre-wrap;word-break:break-word}
.tick{border:2px solid #777;background:transparent;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:transparent;font-size:19px}
.ent.done .tick{background:#2f9e55;border-color:#2f9e55;color:#fff}
.pill{font-size:12px;border-radius:10px;padding:2px 9px;background:#555;color:#eee}
.pill.ok{background:#256b40}.pill.wait{background:#1d4f8f}
.empty{text-align:center;color:#999;padding:26px 8px;font-size:15px}
.tot{display:flex;gap:16px;flex-wrap:wrap;background:#2a2a2a;border-radius:10px;padding:9px 12px;margin:8px 0;font-size:14px}
.tot b{color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin:20px 0 6px;direction:ltr}
.keys button{width:76px;height:76px;border-radius:50%;border:1px solid #666;background:#3a3a3a;font-size:28px;color:#fff}
.keys button:active{background:#5a5a5a}.keys button.o{border-color:transparent;background:transparent;font-size:18px;color:#ccc}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 4px;direction:ltr;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #aaa}.dots i.on{background:#fff;border-color:#fff}
.dots.bad{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ---- auth ---- */
.auth{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 90% at 50% 0%,#5a1a6b 0%,#2c1033 55%,#242424 100%);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}
.auth .card{width:100%;max-width:420px;background:rgba(30,30,30,.82);border:1px solid #5b3a66;border-radius:18px;padding:22px 20px 20px;backdrop-filter:blur(6px)}
.auth .logo{display:grid;place-items:center;margin-bottom:6px}
.auth .logo svg{width:64px;height:64px}
.auth h2{text-align:center;margin:6px 0 2px;font-size:22px}
.auth p.d{text-align:center;color:#c9b2d3;margin:0 0 10px;font-size:14px}
.auth label{display:block;margin:12px 0 5px;font-size:14px;color:#ddd}
.auth .lk{display:block;text-align:center;margin-top:14px;color:#e0b3ee;font-size:14px;background:none;border:0;width:100%;padding:6px}

.toast{position:fixed;top:calc(var(--safe-t) + 66px);left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:24px;z-index:90;font-size:14px;box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.conv{background:#2f2f2f;border-radius:12px;padding:12px;margin-top:12px}
.conv .res{margin-top:8px;font-size:17px;font-weight:700;color:#fff;min-height:26px}
.conv .res small{display:block;font-size:13px;color:var(--orange);font-weight:400}
@media (max-width:420px){.cell .p{font-size:17px}.cell .s{font-size:12px}.cell{padding:2px 4px}.keys{grid-template-columns:repeat(3,68px)}.keys button{width:68px;height:68px}}
@media (hover:hover){.cell:not(.blank):hover{filter:brightness(1.18)}}

.warn{background:#6b4a00;color:#fff3d6;font-size:12.5px;line-height:1.55;padding:7px 10px;display:flex;gap:8px;align-items:center;flex:none}
.warn span{flex:1}
.warn button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:14px;padding:3px 10px;font-size:12px;white-space:nowrap}

</style>
</head>
<body>
<div id="app" class="hide">
  <header class="topbar">
    <h1>تقويمي</h1>
    <button class="ib" data-act="today" aria-label="اليوم" title="اليوم"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg><span class="tn" id="tn"></span></button>
    <button class="ib" data-act="add" aria-label="إضافة مناسبة أو مهمة" title="إضافة"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="ib" data-act="conv" aria-label="تحويل التاريخ" title="تحويل التاريخ"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg></button>
    <button class="ib" data-act="menu" aria-label="القائمة" title="القائمة"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7" fill="#fff"/><circle cx="12" cy="12" r="1.7" fill="#fff"/><circle cx="12" cy="19" r="1.7" fill="#fff"/></svg></button>
  </header>
  <div class="warn hide" id="warn"><span>نسخة غير مثبّتة (ملف أو عنوان مؤقت): قد لا تبقى بياناتك. صدّر نسخة Excel احتياطية بانتظام.</span><button data-act="exportNow">تصدير الآن</button><button data-act="warnx" aria-label="إخفاء التنبيه">×</button></div>
  <nav class="menu hide" id="menu">
    <button data-act="search">🔎 بحث وقائمة المهام</button>
    <button data-act="settings">⚙️ الإعدادات</button>
    <hr>
    <button data-act="export">📤 تصدير إلى Excel 97-2003</button>
    <button data-act="import">📥 استيراد من Excel 97-2003</button>
    <hr>
    <button data-act="lock">🔒 قفل التطبيق</button>
    <button data-act="logout">🚪 تسجيل الخروج</button>
  </nav>
  <div class="mhead">
    <button class="nav" data-act="prev" aria-label="الشهر السابق">»</button>
    <button class="mtitle" id="mtitle" data-act="jump" aria-label="الانتقال إلى شهر"><b></b><span></span></button>
    <button class="nav" data-act="next" aria-label="الشهر التالي">«</button>
  </div>
  <div class="yearnav"><button data-act="prevY">السنة السابقة</button><button data-act="today">اليوم</button><button data-act="nextY">السنة التالية</button></div>
  <div class="wd" id="wd"></div>
  <main class="grid" id="grid" aria-live="polite"></main>
  <footer class="legend">
    <span><i style="background:var(--c-empty)"></i>فارغ</span>
    <span><i style="background:var(--c-reg)"></i>مسجّلة (لم تنجز)</span>
    <span><i style="background:var(--c-done)"></i>منجزة</span>
    <span><i style="background:#ff5a4a;border-radius:50%"></i>متأخرة</span>
  </footer>
</div>
<input type="file" id="file" class="hide" accept=".xls,application/vnd.ms-excel">
<script>
/* ===== Excel 97-2003 (BIFF8 / OLE2) reader ===== */
const XLSR = (function () {
  const NOSTREAM = 0xFFFFFFFA;
  function oleParse(b) {
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    if (b.length < 512) throw new Error('bad');
    for (let i = 0; i < 8; i++) if (b[i] !== sig[i]) throw new Error('bad');
    const secSize = 1 << dv.getUint16(0x1E, true), miniSize = 1 << dv.getUint16(0x20, true);
    const dirStart = dv.getUint32(0x30, true), miniCutoff = dv.getUint32(0x38, true);
    const miniFatStart = dv.getUint32(0x3C, true);
    const difatStart = dv.getUint32(0x44, true), nDifat = dv.getUint32(0x48, true);
    const secOff = s => (s + 1) * secSize;
    const fatSecs = [];
    for (let i = 0; i < 109; i++) { const s = dv.getUint32(0x4C + 4 * i, true); if (s < NOSTREAM) fatSecs.push(s); }
    let d = difatStart;
    for (let k = 0; k < nDifat && d < NOSTREAM; k++) {
      const off = secOff(d);
      for (let i = 0; i < secSize / 4 - 1; i++) { const s = dv.getUint32(off + 4 * i, true); if (s < NOSTREAM) fatSecs.push(s); }
      d = dv.getUint32(off + secSize - 4, true);
    }
    const per = secSize / 4, fat = new Uint32Array(fatSecs.length * per);
    fatSecs.forEach((s, i) => { const off = secOff(s); for (let j = 0; j < per; j++) fat[i * per + j] = dv.getUint32(off + 4 * j, true); });
    function chain(start, table) {
      const out = [], seen = new Set(); let s = start;
      while (s < NOSTREAM && !seen.has(s) && s < table.length) { seen.add(s); out.push(s); s = table[s]; }
      return out;
    }
    function readChain(start) {
      const secs = chain(start, fat), out = new Uint8Array(secs.length * secSize);
      secs.forEach((s, i) => { const o = secOff(s); out.set(b.subarray(o, Math.min(o + secSize, b.length)), i * secSize); });
      return out;
    }
    const dir = readChain(dirStart), ddv = new DataView(dir.buffer);
    const entries = [];
    for (let i = 0; i + 128 <= dir.length; i += 128) {
      const nl = ddv.getUint16(i + 64, true);
      let name = '';
      for (let k = 0; k < Math.max(0, nl / 2 - 1) && k < 31; k++) name += String.fromCharCode(ddv.getUint16(i + 2 * k, true));
      entries.push({ name, type: dir[i + 66], start: ddv.getUint32(i + 116, true), size: ddv.getUint32(i + 120, true) });
    }
    const root = entries[0];
    let mini = null, miniFat = null;
    function getStream(e) {
      if (e.size < miniCutoff) {
        if (!mini) {
          mini = readChain(root.start);
          const mf = readChain(miniFatStart), mdv = new DataView(mf.buffer);
          miniFat = new Uint32Array(mf.length / 4);
          for (let i = 0; i < miniFat.length; i++) miniFat[i] = mdv.getUint32(4 * i, true);
        }
        const secs = chain(e.start, miniFat), out = new Uint8Array(secs.length * miniSize);
        secs.forEach((s, i) => out.set(mini.subarray(s * miniSize, (s + 1) * miniSize), i * miniSize));
        return out.subarray(0, e.size);
      }
      return readChain(e.start).subarray(0, e.size);
    }
    return { entries, getStream };
  }

  class Chunks {
    constructor(list) { this.c = list; this.i = 0; this.p = 0; }
    _norm() { while (this.i < this.c.length - 1 && this.p >= this.c[this.i].length) { this.i++; this.p = 0; } }
    u8() { this._norm(); return this.c[this.i][this.p++]; }
    u16() { const a = this.u8(); return a | (this.u8() << 8); }
    u32() { const a = this.u16(); return (a + this.u16() * 65536) >>> 0; }
    skip(n) { while (n > 0) { this._norm(); const left = this.c[this.i].length - this.p; if (left <= 0) return; const t = Math.min(n, left); this.p += t; n -= t; } }
    chars(cch, wide) {
      let s = '';
      while (cch > 0) {
        if (this.p >= this.c[this.i].length) {
          if (this.i >= this.c.length - 1) break;
          this.i++; this.p = 0; wide = (this.c[this.i][this.p++] & 1) === 1; continue;
        }

const HEAD = ['التاريخ الهجري', 'التاريخ الميلادي', 'نوع المناسبة / المهمة', 'اسم صاحب المناسبة / المهمة', 'رقم الجوال', 'المبلغ المدفوع', 'المبلغ المتبقي', 'ملاحظات', 'الحالة'];

const FIELD_RX = [['hijri', /هجري/], ['greg', /ميلادي/], ['phone', /جوال|هاتف|موبايل|محمول|mobile|phone|tel/], ['paid', /مدفوع|دفع|paid/], ['rem', /متبقي|باقي|remain/],
  ['notes', /ملاحظ|note/], ['done', /انجز|حاله|status|done/], ['type', /نوع|type/], ['name', /اسم|name/], ['date', /تاريخ|date/]];
const nrm = s => norm(s).replace(/[\u064B-\u065F\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();

function parseAnyDate(v, d1904) {
  if (v === '' || v == null) return NaN;
  if (typeof v === 'number') return (v > 20000 && v < 90000) ? Math.floor(v) + (d1904 ? 1462 : 0) - 25569 : NaN;
  const m = norm(String(v)).match(/(\d{1,4})\D+(\d{1,2})\D+(\d{1,4})/);
  if (!m) return NaN;
  const a = +m[1], b = +m[2], c = +m[3]; let y, mo, d;
  if (m[1].length >= 3 || a > 31) { y = a; mo = b; d = c; } else if (m[3].length >= 3 || c > 31) { y = c; mo = b; d = a; } else return NaN;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return NaN;
  if (y >= Y0 && y <= Y1) return d > hLen(y, mo) ? NaN : hStart(y, mo, S.set.off) + d - 1;
  if (y >= 1883 && y <= 2173) { const n = dnum(y, mo, d), p = dparts(n); return (p.m === mo && p.d === d) ? n : NaN; }

const entKey = e => [e.date, e.type || '', e.name || '', e.phone || '', e.paid == null ? '' : e.paid, e.rem == null ? '' : e.rem, e.notes || ''].join('|');
function parseImport(res) {
  const sh = res.sheets.filter(s => !s.hidden && s.rows.length).sort((a, b) => (b.name === 'المهام') - (a.name === 'المهام'))[0];
  if (!sh) return { ok: [], bad: 0, dup: 0 };
  const rows = sh.rows; let hr = -1, map = null;
  for (let i = 0; i < Math.min(rows.length, 10) && !map; i++) {
    const m = {}; let cnt = 0;
    (rows[i] || []).forEach((cell, c) => {
      if (typeof cell !== 'string' || !cell.trim()) return; const t = nrm(cell);
      for (const f of FIELD_RX) if (f[1].test(t) && !(f[0] in m)) { m[f[0]] = c; cnt++; break; }
    });
    if (cnt >= 2) { hr = i; map = m; }
  }
  if (!map) map = { hijri: 0, greg: 1, type: 2, name: 3, phone: 4, paid: 5, rem: 6, notes: 7, done: 8 };
  const exist = new Set(S.data.entries.map(entKey)), ok = []; let bad = 0, dup = 0;
  const txt = v => (v == null ? '' : String(v)).trim();
  for (let r = hr + 1; r < rows.length; r++) {
    const row = rows[r] || []; if (!row.some(x => x !== '' && x != null)) continue;
    const g = k => (k in map ? row[map[k]] : undefined);
    let n = NaN; for (const k of ['greg', 'hijri', 'date']) if (k in map) { n = parseAnyDate(g(k), res.date1904); if (!isNaN(n)) break; }
    const type = txt(g('type')), name = txt(g('name')), notes = txt(g('notes'));
    if (isNaN(n) || n < MIN_DAY || n > MAX_DAY || (!type && !name && !notes)) { bad++; continue; }
    let phone = txt(g('phone')); if (typeof g('phone') === 'number' && /^5\d{8}$/.test(phone)) phone = '0' + phone;
    const pv = x => { const v = num(x); return (v == null || isNaN(v)) ? null : v; };
    const e = { id: uid(), ts: Date.now() + ok.length, date: iso(n), type, name, phone: norm(phone), paid: pv(g('paid')), rem: pv(g('rem')), notes, done: isDoneVal(g('done')) };
    e._dup = exist.has(entKey(e)); if (e._dup) dup++; ok.push(e);
  }

}

function handleFile(f) {
  const go = buf => {
    try { const res = XLSR.read(new Uint8Array(buf)); importPreview(parseImport(res), f.name); }

}

}

/* ---------- auth screens ---------- */
const LOGO = '<div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#5a1a6b"/><rect x="11" y="15" width="42" height="38" rx="6" fill="#f2f2f2"/><rect x="11" y="15" width="42" height="11" rx="6" fill="#f49426"/><rect x="11" y="21" width="42" height="5" fill="#f49426"/><rect x="19" y="9" width="4" height="12" rx="2" fill="#f2f2f2"/><rect x="41" y="9" width="4" height="12" rx="2" fill="#f2f2f2"/><path d="M21 40l7 7 15-16" fill="none" stroke="#1f7a3d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
function overlay(html) { removeOverlay(); const el = document.createElement('div'); el.className = 'auth'; el.id = 'auth'; el.innerHTML = '<div class="card">' + LOGO + html + '</div>'; document.body.appendChild(el); $('#app').classList.add('hide'); return el; }
function removeOverlay() { const o = $('#auth'); if (o) o.remove(); }
const aerr = (el, m) => { $('#aerr', el).innerHTML = '<div class="err">' + esc(m) + '</div>'; };

const needWarn = () => !window.AndroidBridge && !LS.get('tm.nowarn') && (location.protocol === 'file:' || /^(localhost|\[.*\]|\d{1,3}(\.\d{1,3}){3})$/.test(location.hostname));
function enter(u, after) {
  S.user = u; S.data = normData(LS.get('tm.d.' + u.id)); S.set = S.data.set; S.sel = null; dayOpen = null;
  SS.set('tm.s', u.id); LS.set('tm.last', u.id);
  removeOverlay(); $('#app').classList.remove('hide'); applyColors(); S.view = viewFor(todayN()); render();
  $('#warn').classList.toggle('hide', !needWarn());
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  if (after) after();
}
function lockNow(logout) {
  closeAll(); toggleMenu(false);
  const u = S.user; S.user = null; S.data = null; S.set = null; dayOpen = null;
  SS.del('tm.s'); $('#grid').innerHTML = '';
  if (!logout && u) showLock(u); else showLogin();
}
function showRegister(first) {
  const el = overlay('<h2>إنشاء حساب</h2><p class="d">' + (first ? 'مرحبًا بك في تقويمي – مهام. أنشئ حسابك وحدد رقمًا سريًا للدخول.' : 'أنشئ حسابًا جديدًا على هذا الجهاز') + '</p><div id="aerr"></div>' +
    '<label for="rn">الاسم</label><input type="text" id="rn" autocomplete="name" maxlength="40">' +
    '<label for="rus">اسم المستخدم</label><input type="text" class="ltr" id="rus" autocomplete="username" autocapitalize="none" maxlength="30">' +
    '<label for="rp1">كلمة المرور (6 أحرف على الأقل)</label><input type="password" id="rp1" autocomplete="new-password">' +
    '<label for="rp2">تأكيد كلمة المرور</label><input type="password" id="rp2" autocomplete="new-password">' +
    '<label for="rpin">الرقم السري للدخول إلى التطبيق (4 – 8 أرقام)</label><input type="password" class="ltr" id="rpin" inputmode="numeric" maxlength="8" autocomplete="off">' +
    '<label for="rpin2">تأكيد الرقم السري</label><input type="password" class="ltr" id="rpin2" inputmode="numeric" maxlength="8" autocomplete="off">' +
    '<div class="btns"><button class="btn" id="rgo">إنشاء الحساب</button></div>' + (users().length ? '<button class="lk" id="rback">لدي حساب — تسجيل الدخول</button>' : ''));
  const go = () => {
    const nm = $('#rn', el).value.trim(), un = $('#rus', el).value.trim(), p1 = $('#rp1', el).value, p2_ = $('#rp2', el).value, pin = norm($('#rpin', el).value).trim(), pin2 = norm($('#rpin2', el).value).trim();
    if (un.length < 3 || /\s/.test(un)) return aerr(el, 'اسم المستخدم 3 أحرف على الأقل وبدون مسافات.');
    if (users().some(x => x.username.toLowerCase() === un.toLowerCase())) return aerr(el, 'اسم المستخدم مستخدم من قبل، اختر اسمًا آخر.');
    if (p1.length < 6) return aerr(el, 'كلمة المرور يجب ألا تقل عن 6 أحرف.');
    if (p1 !== p2_) return aerr(el, 'تأكيد كلمة المرور غير مطابق.');
    if (!/^\d{4,8}$/.test(pin)) return aerr(el, 'الرقم السري يجب أن يتكون من 4 إلى 8 أرقام.');
    if (pin !== pin2) return aerr(el, 'تأكيد الرقم السري غير مطابق.');
    const salt = SHA.newSalt(), pinSalt = SHA.newSalt();
    const u = { id: uid(), username: un, name: nm || un, salt, hash: SHA.salted(p1, salt), pinSalt, pinHash: SHA.salted(pin, pinSalt), pinLen: pin.length, created: Date.now() };
    if (!saveUsers(users().concat([u])) || !LS.set('tm.d.' + u.id, normData({}))) return aerr(el, 'تعذّر حفظ الحساب على الجهاز (التخزين المحلي معطّل في المتصفح).');
    enter(u);
  };
  $('#rgo', el).onclick = go;
  el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  if ($('#rback', el)) $('#rback', el).onclick = () => showLogin();
}
function showLogin(o) {
  o = o || {};
  const last = users().find(x => x.id === LS.get('tm.last'));
  const el = overlay('<h2>تسجيل الدخول</h2><p class="d">' + (o.resetPin ? 'سجّل الدخول بكلمة المرور ثم عيّن رقمًا سريًا جديدًا' : 'أدخل بيانات حسابك') + '</p><div id="aerr"></div>' +
    '<label for="lus">اسم المستخدم</label><input type="text" class="ltr" id="lus" autocomplete="username" autocapitalize="none" value="' + esc(last ? last.username : '') + '">' +
    '<label for="lpw">كلمة المرور</label><input type="password" id="lpw" autocomplete="current-password">' +
    '<div class="btns"><button class="btn" id="lgo">دخول</button></div><button class="lk" id="lnew">إنشاء حساب جديد</button>');
  const go = () => {
    const un = $('#lus', el).value.trim().toLowerCase(), pw = $('#lpw', el).value;
    const u = users().find(x => x.username.toLowerCase() === un);
    if (!u || !pwOk(u, pw)) return aerr(el, 'اسم المستخدم أو كلمة المرور غير صحيحة.');
    enter(u, o.resetPin ? () => openPinForm({ reset: true }) : null);
  };
  $('#lgo', el).onclick = go; $('#lnew', el).onclick = () => showRegister(false);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => $(last ? '#lpw' : '#lus', el).focus(), 60);
}
function showLock(u) {
  let buf = '', busy = false;
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => '<button data-k="' + k + '">' + k + '</button>').join('') + '<button class="o" data-k="c">مسح</button><button data-k="0">0</button><button class="o" data-k="b" aria-label="حذف">⌫</button>';
  const el = overlay('<h2>الرقم السري</h2><p class="d">مرحبًا ' + esc(u.name) + '</p><div class="dots" id="dots"></div><div id="aerr"></div><div class="keys">' + keys + '</div>' +
    '<button class="lk" id="lf">نسيت الرقم السري؟</button><button class="lk" id="lo">تسجيل الدخول بحساب آخر</button>');
  const dots = () => { $('#dots', el).innerHTML = Array.from({ length: u.pinLen || 4 }, (_, i) => '<i class="' + (i < buf.length ? 'on' : '') + '"></i>').join(''); };
  const wait = () => { const F = LS.get('tm.fail') || { n: 0, until: 0 }; return Math.max(0, Math.ceil((F.until - Date.now()) / 1000)); };
  const press = k => {
    if (!$('#auth') || busy) return;
    const w = wait(); if (w > 0) { aerr(el, 'محاولات كثيرة خاطئة. حاول بعد ' + w + ' ثانية.'); return; }
    if (k === 'b') buf = buf.slice(0, -1); else if (k === 'c') buf = ''; else if (buf.length < (u.pinLen || 4)) buf += k;
    $('#aerr', el).innerHTML = ''; dots();
    if (buf.length === (u.pinLen || 4)) {
      busy = true;
      setTimeout(() => {
        if (SHA.salted(buf, u.pinSalt) === u.pinHash) { LS.del('tm.fail'); document.removeEventListener('keydown', onKey); enter(u); return; }
        const F = LS.get('tm.fail') || { n: 0, until: 0 }; F.n++; if (F.n >= 5) { F.until = Date.now() + 30000; F.n = 0; } LS.set('tm.fail', F);
        buf = ''; busy = false; dots(); const d = $('#dots', el); d.classList.add('bad'); setTimeout(() => d.classList.remove('bad'), 400);
        aerr(el, F.until > Date.now() ? 'محاولات كثيرة خاطئة. حاول بعد 30 ثانية.' : 'الرقم السري غير صحيح.');
      }, 30);
    }
  };
  const onKey = e => { if (!$('#dots')) { document.removeEventListener('keydown', onKey); return; } if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('b'); else if (e.key === 'Escape') press('c'); };
  document.addEventListener('keydown', onKey);
  $$('.keys button', el).forEach(b => b.onclick = () => press(b.dataset.k));
  $('#lf', el).onclick = () => { document.removeEventListener('keydown', onKey); showLogin({ resetPin: true }); };
  $('#lo', el).onclick = () => { document.removeEventListener('keydown', onKey); showLogin(); };
  dots();
}

/* ---------- wiring ---------- */
function buildStatic() {
  $('#wd').innerHTML = WDS.map((w, i) => '<div' + (i === 5 ? ' class="fri"' : '') + '>' + w + '</div>').join('');
}
document.addEventListener('click', ev => {
  if (!ev.target.closest('#menu') && !ev.target.closest('[data-act="menu"]')) toggleMenu(false);
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act; if (a === 'none') return;
  if (!S.user && a !== 'close') return;
  switch (a) {
    case 'prev': navMonth(-1); break;
    case 'next': navMonth(1); break;
    case 'prevY': navYear(-1); break;
    case 'nextY': navYear(1); break;
    case 'today': gotoToday(); break;
    case 'menu': toggleMenu(); break;
    case 'add': openForm({ date: S.sel != null ? S.sel : todayN() }); break;
    case 'conv': openConv(); break;
    case 'jump': openJump(); break;
    case 'day': openDay(+t.dataset.n); break;
    case 'close': closeModal(t.closest('.sheet')); break;
    case 'edit': openForm({ id: t.dataset.id }); break;
    case 'toggle': { const e = S.data.entries.find(x => x.id === t.dataset.id); if (e) { e.done = !e.done; e.upd = Date.now(); persist(); render(); refreshDay(); } break; }
    case 'addDay': openForm({ date: +t.dataset.n }); break;
    case 'search': openSearch(); break;
    case 'settings': openSettings(); break;
    case 'export': doExport(); break;
    case 'exportNow': doExport(); break;
    case 'warnx': LS.set('tm.nowarn', 1); $('#warn').classList.add('hide'); break;
    case 'import': $('#file').click(); break;
    case 'lock': lockNow(false); break;
    case 'logout': lockNow(true); break;
  }
});
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f && S.user) handleFile(f); });
document.addEventListener('keydown', e => {
  if (!S.user || stack.length || e.target.closest('input,textarea,select')) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('cell')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'ArrowLeft') navMonth(1); else if (e.key === 'ArrowRight') navMonth(-1);
  else if (e.key === 'PageUp') navYear(-1); else if (e.key === 'PageDown') navYear(1); else if (e.key === 't' || e.key === 'T') gotoToday();
});
let tx = null, ty = 0;
$('#grid').addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY; }, { passive: true });
$('#grid').addEventListener('touchend', e => {
  if (tx == null) return; const t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty; tx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) navMonth(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) S.hidden = Date.now();
  else if (S.user && S.hidden && Date.now() - S.hidden > 5 * 60 * 1000) lockNow(false);
});
window.__onBack = () => {
  if (stack.length) { closeModal(); return true; }
  const m = $('#menu'); if (m && !m.classList.contains('hide')) { toggleMenu(false); return true; }
  return false;
};
window.__tm = { S: () => S, hij: n => hij(n, 0), todayN };   // small hook used by tests

function init() {
  buildStatic();
  const us = users(), u = us.find(x => x.id === LS.get('tm.last')) || null;
  if (!us.length) { showRegister(true); return; }
  if (u && SS.get('tm.s') === u.id) { enter(u); return; }
  if (u) showLock(u); else showLogin();
}
init();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();

</script>
